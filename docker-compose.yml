version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/devscheduler
      - REDIS_ADDR=redis:6379
      - CHATBOT_SERVICE_URL=http://chatbot:3001/api/chat
    env_file:
      - ./Backend/.env
    depends_on:
      - mongodb
      - redis
      - chatbot
    restart: always

  chatbot:
    build:
      context: ./chat-bot
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    env_file:
      - ./chat-bot/.env
    depends_on:
      - chromadb
    restart: always

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/data
    restart: always

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data:
  redis_data:
  chromadb_data:
